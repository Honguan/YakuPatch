[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yakupatch"
version = "1.0.0"
description = "Translate game text by patching game files directly, with backup and restore."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["opencc-python-reimplemented>=0.1.7", "keyring>=24", "PySide6-Essentials>=6.7", "UnityPy>=1.25", "TypeTreeGeneratorAPI>=0.0.10", "fonttools>=4.40"]

[project.urls]
Repository = "https://github.com/Honguan/YakuPatch"

[project.scripts]
yakupatch = "yakupatch.cli:main"

[project.gui-scripts]
yakupatch-gui = "yakupatch.gui:main"

[tool.setuptools.packages.find]
include = ["yakupatch*"]

[tool.setuptools.package-data]
"yakupatch.gui" = ["icon.ico", "icon.png"]
