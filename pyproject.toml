[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yakupatch"
version = "0.1.0"
description = "Translate game text by patching game files directly, with backup and restore."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["opencc-python-reimplemented>=0.1.7"]

[project.urls]
Repository = "https://github.com/Honguan/YakuPatch"

[project.scripts]
yakupatch = "yakupatch.cli:main"

[tool.setuptools.packages.find]
include = ["yakupatch*"]
